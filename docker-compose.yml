services:
  backend:
    image: xichun/ustb-manager-backend:latest
    container_name: ustb-backend
    restart: unless-stopped
    environment:
      - COOKIE_SECURE=true
      - SESSION_TTL=31536000
    networks:
      - ustb-network

  frontend:
    image: xichun/ustb-manager-frontend:latest
    container_name: ustb-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8032:80"
    depends_on:
      - backend
    networks:
      - ustb-network

networks:
  ustb-network:
    driver: bridge
