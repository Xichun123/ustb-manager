[project]
name = "ustb-manager-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.6",
    "no_puzzle_captcha>=0.1.0",
    "USTB-SSO>=1.3.0",
    "pycryptodome>=3.23.0",
    "cachetools>=5.3.0",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"app/api/auth.py" = ["F401"]
"app/services/auth_service.py" = ["F841"]
"app/services/byyt_crypto.py" = ["F401"]
"app/services/cookie_store.py" = ["F401"]
"app/services/webvpn_converter.py" = ["F401", "F541"]
"app/services/wifi_service.py" = ["F541", "F841"]
"app/services/wifi_service_direct.py" = ["F541"]
"app/services/wifi_store.py" = ["F401"]
