[project]
name = "ustb-manager-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.6",
    "no_puzzle_captcha>=0.1.0",
    "USTB-SSO>=1.3.0",
    "pycryptodome>=3.23.0",
    "cachetools>=5.3.0",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
