name: Miniapp

on:
  push:
    paths:
      - "miniapp/**"
      - ".github/workflows/miniapp.yml"
  pull_request:
    paths:
      - "miniapp/**"
      - ".github/workflows/miniapp.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated API type sync
        run: cmp miniprogram/services/openapi.d.ts ../frontend/src/services/openapi.d.ts

      - name: Service tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Dependency audit
        run: npm audit --audit-level=high
