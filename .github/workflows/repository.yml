name: Repository

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/repository.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/repository.yml"

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          IMAGE_TAG: ci
          SESSION_ENCRYPTION_KEY: ci-placeholder
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --tag ustb-manager-backend:ci backend

      - name: Build frontend image
        run: docker build --tag ustb-manager-frontend:ci frontend

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
